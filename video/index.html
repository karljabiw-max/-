<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>《不》· Vibe知识大赏</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{margin:0;background:#050510;overflow:hidden}
  canvas{display:block;width:1920px;height:1080px}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script id="main">
// 《不》—— 两岁的孩子，为什么总说「不」？
// 画面只由 t（秒）决定：window.render(t)。无计时器、无帧间状态、随机数固定种子。
const W = 1920, H = 1080, DUR = 135;
const AUTHOR = '@karljabiw';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  bg0: '#050510', bg1: '#12122a', fg: '#EAEAF2', gray: '#8A8AA0', gold: '#C9A96A',
  paper: '#EDE4D3', ink: '#2a2420', red: '#B53A2F', warm: '#E8A87C', blue: '#7FA7D9',
};
const F = { sans: '"Noto Sans SC", "WenQuanYi Zen Hei", sans-serif', serif: '"Noto Serif SC", serif', gar: '"EB Garamond", serif' };

// ---------- 数学工具 ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eo = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
// 时间窗包络：a 时淡入，b 时淡出
const win = (t, a, b, fi = .5, fo = .5) => Math.min(eio(prog(t, a, a + fi)), 1 - eio(prog(t, b - fo, b)));
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- 绘图工具 ----------
function font(o) { return `${o.it ? 'italic ' : ''}${o.w || 400} ${o.s || 32}px ${o.f || F.sans}`; }
function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.a ?? 1);
  ctx.font = font(o);
  ctx.fillStyle = o.c || C.fg;
  ctx.textAlign = o.al || 'center';
  ctx.textBaseline = o.bl || 'middle';
  ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 30; }
  ctx.fillText(s, x, y);
  ctx.restore();
}
// 「」内的关键词用金色
function rich(s, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.a ?? 1);
  ctx.font = font(o);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  const segs = []; let cur = '', hi = false;
  for (const ch of s) {
    if (ch === '「') { if (cur) segs.push([cur, hi]); cur = ch; hi = true; continue; }
    if (ch === '」') { cur += ch; segs.push([cur, true]); cur = ''; hi = false; continue; }
    cur += ch;
  }
  if (cur) segs.push([cur, hi]);
  const total = segs.reduce((w, [s]) => w + ctx.measureText(s).width, 0);
  let cx = x - total / 2;
  for (const [sg, h] of segs) { ctx.fillStyle = h ? C.gold : (o.c || C.fg); ctx.fillText(sg, cx, y); cx += ctx.measureText(sg).width; }
  ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function withA(a, fn) { if (a <= 0.001) return; ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }
function at(x, y, s, rot, fn) { ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (s !== 1) ctx.scale(s, s); fn(); ctx.restore(); }

// ---------- 背景 ----------
const R0 = rng(7);
const STARS = Array.from({ length: 240 }, () => ({ x: R0() * W, y: R0() * H, r: .4 + R0() * 1.4, w: .3 + R0() * 1.6, p: R0() * 6.28, b: .15 + R0() * .5 }));
const DUST = Array.from({ length: 40 }, () => ({ x: R0() * W, y: R0() * H, r: 1 + R0() * 2.5, vx: (R0() - .5) * 8, vy: -2 - R0() * 6, b: .05 + R0() * .12 }));
function drawBG(t) {
  const g = ctx.createRadialGradient(W / 2, H * .42, 80, W / 2, H * .45, 1150);
  g.addColorStop(0, '#14142e'); g.addColorStop(.55, '#0b0b1d'); g.addColorStop(1, C.bg0);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of STARS) {
    const a = s.b * (.55 + .45 * Math.sin(t * s.w + s.p));
    ctx.fillStyle = `rgba(220,220,255,${a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  }
  for (const d of DUST) {
    const x = ((d.x + d.vx * t) % W + W) % W, y = ((d.y + d.vy * t) % H + H) % H;
    ctx.fillStyle = `rgba(201,169,106,${d.b})`;
    ctx.beginPath(); ctx.arc(x, y, d.r, 0, 6.283); ctx.fill();
  }
}

// ---------- 恒定版式：水印 / 顶标签 / 注释 / 双语字幕 ----------
const TAGS = [
  [0, 14.3, '两岁 · TWO YEARS OLD'],
  [20.4, 32.1, '1970 · 镜子测试 · MIRROR TEST'],
  [32.1, 52.1, '1972 · 胭脂测试 · ROUGE TEST'],
  [52.1, 64.1, '「我想」与「我能」'],
  [64.1, 72.1, '语言 · 词汇爆发'],
  [72.1, 80.1, '大脑 · 油门与刹车'],
  [80.1, 88.1, '那一道沟 · THE GAP'],
  [88.1, 96.1, '「不」 · NO'],
  [96.1, 104.1, '1950 · 人生八阶段'],
  [104.1, 116.1, '大人能做的三件小事'],
  [116.1, 124.1, '两岁 · TWO YEARS OLD'],
  [124.1, 135.5, '声明与参考 · NOTES'],
];
const SUBS = [
  [0.6, 4.0, '两岁的孩子，会说的词越来越多', 'At two, the words keep coming.'],
  [4.1, 7.5, '但有一个字，用得最多', 'But one word gets used the most.'],
  [7.6, 11.0, '穿鞋？「不」。吃饭？「不」。', 'Shoes? No. Dinner? No.'],
  [11.1, 14.4, 'Ta 是在故意跟你作对吗？', 'Are they doing it on purpose?'],
  [20.6, 24.4, '1970 年，心理学家盖洛普做了一个实验', 'In 1970, psychologist Gordon Gallup ran a test.'],
  [24.5, 28.2, '趁黑猩猩麻醉睡着，在它额头染上红色', 'While a chimp slept, he marked its brow with red dye.'],
  [28.3, 32.0, '醒来照镜子，它摸向了「自己」的额头', 'Awake at the mirror, it touched its own brow.'],
  [32.1, 36.0, '两年后，这面镜子被搬到了婴儿面前', 'Two years later, the mirror was set before babies.'],
  [36.1, 40.0, '在孩子鼻子上，偷偷抹一点胭脂', 'A secret dab of rouge on the nose.'],
  [40.1, 44.0, '一岁左右，镜子里像是「另一个小朋友」', 'Around one, the mirror holds another child.'],
  [44.1, 48.0, '快到两岁，多数孩子摸向了自己的鼻子', 'Near two, most reach for their own nose.'],
  [48.1, 52.0, '那一刻，「我」出现了', 'In that moment, a "me" appears.'],
  [52.1, 56.0, '有了「我」，就有了「我想」', 'With "me" comes "I want."'],
  [56.1, 60.0, '我要自己穿鞋，自己倒水，自己按电梯', 'My shoes. My water. My button.'],
  [60.1, 64.0, '可手还不够巧，话也说不清', 'But hands fumble, and words won’t come.'],
  [64.1, 68.0, '一岁半到两岁，会说的词常常翻好几倍', 'Between 18 and 24 months, words often multiply.'],
  [68.1, 72.0, '可「想说的」，涨得更快', 'But what they want to say grows faster.'],
  [72.1, 76.0, '管住情绪的前额叶，要到二十多岁才成熟', 'The brain’s brakes mature in the mid-twenties.'],
  [76.1, 80.0, '油门已经装好，刹车还在路上', 'The gas is in. The brakes are on the way.'],
  [80.1, 84.0, '「想要」和「做得到」之间，有一道沟', 'Between wanting and doing, there’s a gap.'],
  [84.1, 88.0, '掉进沟里的那一刻，就是哭闹', 'Fall into it, and you get a meltdown.'],
  [88.1, 92.0, '而「不」，是孩子手里最省力的工具', 'And "no" is the easiest tool they have.'],
  [92.1, 96.0, '一个字，就能证明：我和你不一样', 'One word proves: I am not you.'],
  [96.1, 100.0, '埃里克森把这一段，叫作「自主对羞怯」', 'Erikson called it autonomy versus shame.'],
  [100.1, 104.0, '这一关要长出来的，是「意志」', 'What grows here is will.'],
  [104.1, 108.0, '所以，别问「要不要」，问「选哪个」', 'So don’t ask yes or no. Ask which one.'],
  [108.1, 112.0, '替 Ta 说出来：「你很生气」', 'Name it for them: "You’re angry."'],
  [112.1, 116.0, '等风暴过去，再讲道理', 'Let the storm pass. Then explain.'],
  [116.2, 120.0, '孩子说的每一个「不」', 'Every "no" a child says'],
  [120.1, 124.0, '其实都在说：「我」', 'is really saying: "me."'],
  [124.3, 128.4, '每个孩子，都有自己的节奏', 'Every child has their own pace.'],
  [128.6, 134.6, '你家孩子，今天说了几个「不」？', 'How many no’s today?'],
];
const NOTES = [
  [20.8, 24.4, '图为示意 · Science, Vol. 167 (1970)'],
  [28.6, 32.0, '注意：它摸的是自己的额头，不是镜子'],
  [32.4, 36.0, '图为示意 · Developmental Psychobiology, Vol. 5 (1972)'],
  [40.4, 44.0, '伸手摸镜子、冲它笑——像在跟别人打招呼'],
  [44.4, 48.0, '原研究中，20–24 个月组的多数孩子能认出自己'],
  [64.4, 72.0, '示意图 · 词汇量的个体差异很大'],
  [72.4, 80.0, '示意 · 前额叶负责计划与自控，是大脑最晚成熟的区域之一'],
  [84.4, 88.0, '不同研究：18–24 个月的幼儿，约 70%–87% 有过发脾气'],
  [92.4, 96.0, '「不」是孩子画下的第一道边界'],
  [100.4, 104.0, '埃里克森人生八阶段 · 第二阶段 · 约 1.5–3 岁'],
  [104.4, 116.0, '建议仅供参考 · 每个家庭、每个孩子都不一样'],
];
function drawChrome(t) {
  txt(AUTHOR, 56, 64, { s: 26, w: 700, c: C.fg, a: .5, al: 'left' });
  for (const [a, b, s] of TAGS) {
    const al = win(t, a, b, .5, .4);
    if (al <= 0) continue;
    withA(al, () => {
      ctx.save(); ctx.font = font({ s: 24, w: 700 }); ctx.letterSpacing = '4px';
      const w = ctx.measureText(s).width; ctx.restore();
      const y = 64;
      ctx.strokeStyle = 'rgba(201,169,106,.55)'; ctx.lineWidth = 1.5;
      const L = 60 * eo(prog(t, a, a + .8));
      ctx.beginPath(); ctx.moveTo(W / 2 - w / 2 - 24 - L, y); ctx.lineTo(W / 2 - w / 2 - 24, y);
      ctx.moveTo(W / 2 + w / 2 + 24, y); ctx.lineTo(W / 2 + w / 2 + 24 + L, y); ctx.stroke();
      txt(s, W / 2 + 2, y, { s: 24, w: 700, c: C.gold, ls: 4 });
    });
  }
  for (const [a, b, s] of NOTES) {
    const al = win(t, a, b, .4, .3);
    if (al <= 0) continue;
    withA(al, () => {
      ctx.save(); ctx.font = font({ s: 25 }); const w = ctx.measureText(s).width; ctx.restore();
      ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(W / 2 - w / 2 - 18, 778, 4, 0, 6.283); ctx.fill();
      txt(s, W / 2 + 6, 778, { s: 25, c: '#A8A8BC' });
    });
  }
  for (const [a, b, zh, en] of SUBS) {
    const al = win(t, a, b, .35, .3);
    if (al <= 0) continue;
    const dy = (1 - eo(prog(t, a, a + .45))) * 8;
    withA(al, () => {
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 12;
      rich(zh, W / 2, 946 + dy, { s: 46, w: 700 });
      txt(en, W / 2, 1001 + dy, { s: 29, f: F.gar, it: 1, c: C.gray });
      ctx.restore();
    });
  }
}

// ---------- 角色与道具 ----------
function toddler(x, y, s, col = C.paper) {
  at(x, y, s, 0, () => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(0, -92, 34, 0, 6.283); ctx.fill();               // 头
    ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-4, -126); ctx.quadraticCurveTo(6, -142, 16, -132); ctx.stroke(); // 呆毛
    ctx.beginPath(); ctx.moveTo(-28, -52); ctx.quadraticCurveTo(0, -64, 28, -52); ctx.lineTo(34, -6); ctx.quadraticCurveTo(0, 4, -34, -6); ctx.closePath(); ctx.fill(); // 身体
    ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(-14, -4); ctx.lineTo(-16, 18); ctx.moveTo(14, -4); ctx.lineTo(16, 18); ctx.stroke(); // 腿
    ctx.beginPath(); ctx.moveTo(-28, -48); ctx.lineTo(-46, -22); ctx.moveTo(28, -48); ctx.lineTo(46, -22); ctx.stroke(); // 手
  });
}
function chimp(cx, cy, s, open, mark) {
  at(cx, cy, s, 0, () => {
    const dark = '#4a3628', skin = '#b8916f';
    ctx.fillStyle = dark;
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 118, -5, 34, 0, 6.283); ctx.fill(); }
    ctx.fillStyle = '#a07e62';
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 118, -5, 18, 0, 6.283); ctx.fill(); }
    ctx.fillStyle = dark; ctx.beginPath(); ctx.ellipse(0, -10, 115, 125, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.ellipse(0, 22, 84, 92, 0, 0, 6.283); ctx.fill();
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * 38, -30, 46, 40, 0, 0, 6.283); ctx.fill(); }
    ctx.fillStyle = '#3a2a1f'; ctx.beginPath(); ctx.ellipse(0, -62, 82, 15, 0, 0, 6.283); ctx.fill();
    // 眼睛
    for (const sx of [-1, 1]) {
      if (open > .5) {
        ctx.fillStyle = '#efe6d8'; ctx.beginPath(); ctx.ellipse(sx * 34, -32, 13, 11 * (open - .5) * 2 + .5, 0, 0, 6.283); ctx.fill();
        ctx.fillStyle = '#20140c'; ctx.beginPath(); ctx.arc(sx * 34, -32, 7 * clamp((open - .5) * 2), 0, 6.283); ctx.fill();
      } else {
        ctx.strokeStyle = '#3a2a1f'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(sx * 34, -36, 12, .3, Math.PI - .3); ctx.stroke();
      }
    }
    ctx.fillStyle = '#c9a07d'; ctx.beginPath(); ctx.ellipse(0, 50, 60, 46, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#5a4030';
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * 11, 28, 6, 4, 0, 0, 6.283); ctx.fill(); }
    ctx.strokeStyle = '#5a4030'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-30, 70); ctx.quadraticCurveTo(0, 78, 30, 70); ctx.stroke();
    if (mark > 0) {
      ctx.fillStyle = `rgba(214,52,40,${mark})`; ctx.beginPath(); ctx.arc(-64, -66, 12 * eo(mark), 0, 6.283); ctx.fill();
    }
  });
}
function baby(cx, cy, s, mark, t) {
  at(cx, cy, s, 0, () => {
    ctx.fillStyle = '#f2cfae';
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 106, 6, 22, 0, 6.283); ctx.fill(); }
    ctx.beginPath(); ctx.arc(0, 0, 110, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#6b4a33'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-20, -104); ctx.quadraticCurveTo(-4, -140, 22, -120); ctx.quadraticCurveTo(34, -108, 18, -100); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-70, -80); ctx.quadraticCurveTo(-40, -116, -6, -106); ctx.stroke();
    const blink = (Math.sin(t * 1.3) > .985) ? .2 : 1;
    for (const sx of [-1, 1]) {
      ctx.fillStyle = '#2b2030'; ctx.beginPath(); ctx.ellipse(sx * 38, -8, 10, 11 * blink, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx * 38 + 3, -12, 3 * blink, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(240,120,120,.35)'; ctx.beginPath(); ctx.arc(sx * 64, 30, 20, 0, 6.283); ctx.fill();
    }
    ctx.strokeStyle = '#c99476'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 14, 8, .2, Math.PI - .2); ctx.stroke();
    ctx.strokeStyle = '#8a4a40'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, 44, 22, .35, Math.PI - .35); ctx.stroke();
    if (mark > 0) {
      ctx.fillStyle = `rgba(214,52,60,${.85 * mark})`; ctx.beginPath(); ctx.arc(0, 18, 11 * eo(mark), 0, 6.283); ctx.fill();
    }
  });
}
function hand(x, y, s, palm, armFrom) {
  ctx.save();
  if (armFrom) {
    ctx.strokeStyle = palm.arm; ctx.lineWidth = 44 * s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(armFrom[0], armFrom[1]);
    ctx.quadraticCurveTo(armFrom[0] + 40, (armFrom[1] + y) / 2 + 30, x, y + 20 * s); ctx.stroke();
  }
  at(x, y, s, 0, () => {
    ctx.fillStyle = palm.c;
    ctx.beginPath(); ctx.arc(0, 8, 28, 0, 6.283); ctx.fill();
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(-18 + i * 12, -20 - (i === 1 || i === 2 ? 6 : 0), 6.5, 15, 0, 0, 6.283); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(-30, 12, 6.5, 13, -.9, 0, 6.283); ctx.fill();
  });
  ctx.restore();
}
function mirrorFrame(x, y, s, t, glow = 0) {
  at(x, y, s, 0, () => {
    const g = ctx.createLinearGradient(-200, -250, 200, 250);
    g.addColorStop(0, '#222a4a'); g.addColorStop(1, '#0d1124');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 200, 250, 0, 0, 6.283); ctx.fill();
    if (glow > 0) {
      const gg = ctx.createRadialGradient(0, 0, 10, 0, 0, 260);
      gg.addColorStop(0, `rgba(201,169,106,${.45 * glow})`); gg.addColorStop(1, 'rgba(201,169,106,0)');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.ellipse(0, 0, 200, 250, 0, 0, 6.283); ctx.fill();
    }
  });
}
function mirrorSheen(x, y, s, t) {
  at(x, y, s, 0, () => {
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, 200, 250, 0, 0, 6.283); ctx.clip();
    const k = ((t * 0.18) % 1) * 900 - 450;
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    ctx.beginPath(); ctx.moveTo(k - 300, -260); ctx.lineTo(k - 220, -260); ctx.lineTo(k + 40, 260); ctx.lineTo(k - 40, 260); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = C.gold; ctx.lineWidth = 9; ctx.beginPath(); ctx.ellipse(0, 0, 206, 256, 0, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = 'rgba(201,169,106,.4)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 0, 222, 272, 0, 0, 6.283); ctx.stroke();
  });
}
// 做旧纸卡
const SPECK = (() => { const r = rng(42); return Array.from({ length: 260 }, () => [r(), r(), r()]); })();
function paperCard(x, y, w, h, rot, s, content) {
  at(x, y, s, rot, () => {
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
    ctx.fillStyle = C.paper; rr(-w / 2, -h / 2, w, h, 6); ctx.fill(); ctx.restore();
    const g = ctx.createRadialGradient(0, 0, Math.min(w, h) * .2, 0, 0, Math.max(w, h) * .7);
    g.addColorStop(0, 'rgba(255,250,235,0)'); g.addColorStop(1, 'rgba(140,110,70,.28)');
    ctx.fillStyle = g; rr(-w / 2, -h / 2, w, h, 6); ctx.fill();
    for (const [a, b, c] of SPECK) { ctx.fillStyle = `rgba(110,85,55,${.05 + c * .1})`; ctx.fillRect(-w / 2 + a * w, -h / 2 + b * h, 1.5 + c * 2, 1.5 + c * 2); }
    ctx.strokeStyle = 'rgba(120,95,60,.35)'; ctx.lineWidth = 1.5; rr(-w / 2 + 14, -h / 2 + 14, w - 28, h - 28, 3); ctx.stroke();
    content();
  });
}
function seal(x, y, chars, s = 1) {

      ctx.beginPath(); ctx.ellipse(960, 440, 188, 233, -Math.PI / 2, 0, 6.283 * ring); ctx.stroke();
      withA(pw, () => txt('我', 960, 430, { s: 240 * lerp(1.25, 1, pw) + Math.sin(t * 1.5) * 3, w: 900, f: F.serif, c: C.gold, glow: 'rgba(201,169,106,.75)', gb: 60 }));
      withA(eo(prog(t, 121.2, 122)), () => txt('ME', 960, 700, { s: 34, f: F.gar, it: 1, c: C.gray, ls: 8 }));

  });
}
function sceneOutro(t) {
  const a1 = win(t, 124.2, 128.6, .6, .5);
  withA(a1, () => {
    const y = 430 + (1 - eo(prog(t, 124.2, 125))) * 20;
    ctx.fillStyle = 'rgba(18,18,48,.85)'; ctx.strokeStyle = 'rgba(201,169,106,.6)'; ctx.lineWidth = 1.5;
    rr(410, y - 170, 1100, 340, 14); ctx.fill(); ctx.stroke();
    txt('声明', 960, y - 100, { s: 40, w: 900, f: F.serif, c: C.gold });
    txt('Disclaimer', 960, y - 56, { s: 24, f: F.gar, it: 1, c: C.gray });
    txt('本片为科普示意，不构成医疗或育儿建议。', 960, y + 14, { s: 32, w: 700 });
    txt('每个孩子的发育节奏都不一样；如有担心，请咨询儿科医生。', 960, y + 66, { s: 28, c: '#C8C8D8' });
    txt('For education only. Not medical advice.', 960, y + 116, { s: 24, f: F.gar, it: 1, c: C.gray });
  });
  const a2 = win(t, 128.5, 136, .6, .1);
  withA(a2, () => {
    const y0 = 170;
    txt('参考 · References', 960, y0, { s: 34, w: 900, f: F.serif, c: C.gold });
    const refs = [
      'G. G. Gallup Jr., "Chimpanzees: Self-Recognition," Science 167 (1970)',
      'B. Amsterdam, "Mirror Self-Image Reactions Before Age Two," Developmental Psychobiology 5 (1972)',
      'E. H. Erikson, Childhood and Society, W. W. Norton (1950)',
      'L. Fenson et al., "Variability in Early Communicative Development," Monographs of the SRCD 59 (1994)',
      'M. Potegal & R. J. Davidson, "Temper Tantrums in Young Children," J. Dev. Behav. Pediatr. 24 (2003)',
      'N. Gogtay et al., "Dynamic Mapping of Human Cortical Development," PNAS 101 (2004)',
    ];
    refs.forEach((r, i) => withA(eo(prog(t, 128.8 + i * .18, 129.4 + i * .18)), () => txt(r, 960, y0 + 70 + i * 50, { s: 26, f: F.gar, c: '#C8C8D8' })));
    withA(eo(prog(t, 130.2, 131)), () => {
      ctx.strokeStyle = 'rgba(201,169,106,.5)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(760, 560); ctx.lineTo(1160, 560); ctx.stroke();
      txt(AUTHOR + ' 出品', 960, 612, { s: 36, w: 700, c: C.gold });
      txt('本片由 AI 用代码生成 · 无实拍素材 · 图示均为示意', 960, 664, { s: 24, c: C.gray });
    });
  });
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  drawBG(t);
  sceneHook(t);
  sceneTitle(t);
  sceneMirror(t);
  sceneBars(t);
  sceneChart(t);
  sceneBrain(t);
  sceneGap(t);
  sceneNo(t);
  sceneErikson(t);
  sceneCards(t);
  sceneEnd(t);
  sceneOutro(t);
  drawChrome(t);
}
window.render = render;
window.DURATION = DUR;
// 字体子集按需加载：用本脚本出现过的全部字符去请求
window.setup = async function (done) {
  const sample = [...new Set(document.getElementById('main').textContent)].join('');
  const specs = ['400 30px "Noto Sans SC"', '700 30px "Noto Sans SC"', '900 30px "Noto Sans SC"', '700 30px "Noto Serif SC"', '900 30px "Noto Serif SC"', '400 30px "EB Garamond"', 'italic 400 30px "EB Garamond"', '600 30px "EB Garamond"'];
  await Promise.all(specs.map(s => document.fonts.load(s, sample)));
  await document.fonts.ready;
  done && done();
};
// 浏览器直接打开时循环预览
window.setup().then(() => {
  const t0 = performance.now();
  const loop = () => { if (window.__RENDER_MODE__) return; render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  loop();
});
</script>

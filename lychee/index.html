const ctx = cv.getContext('2d');

const C = {
  bg0: '#050510', bg1: '#12122a', fg: '#EAEAF2', gray: '#8A8AA0', gold: '#C9A96A',
  paper: '#EDE4D3', ink: '#2a2420', red: '#B53A2F', warm: '#E8A87C', blue: '#7FA7D9',

const F = { sans: '"Noto Sans SC", "WenQuanYi Zen Hei", sans-serif', serif: '"Noto Serif SC", serif', gar: '"EB Garamond", serif' };

// ---------- 数学工具 ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eo = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
// 时间窗包络：a 时淡入，b 时淡出
const win = (t, a, b, fi = .5, fo = .5) => Math.min(eio(prog(t, a, a + fi)), 1 - eio(prog(t, b - fo, b)));
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- 绘图工具 ----------
function font(o) { return `${o.it ? 'italic ' : ''}${o.w || 400} ${o.s || 32}px ${o.f || F.sans}`; }
function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.a ?? 1);
  ctx.font = font(o);
  ctx.fillStyle = o.c || C.fg;
  ctx.textAlign = o.al || 'center';
  ctx.textBaseline = o.bl || 'middle';
  ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 30; }
  ctx.fillText(s, x, y);
  ctx.restore();
}
// 「」内的关键词用金色
function rich(s, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.a ?? 1);
  ctx.font = font(o);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  const segs = []; let cur = '', hi = false;
  for (const ch of s) {
    if (ch === '「') { if (cur) segs.push([cur, hi]); cur = ch; hi = true; continue; }
    if (ch === '」') { cur += ch; segs.push([cur, true]); cur = ''; hi = false; continue; }
    cur += ch;
  }
  if (cur) segs.push([cur, hi]);
  const total = segs.reduce((w, [s]) => w + ctx.measureText(s).width, 0);
  let cx = x - total / 2;
  for (const [sg, h] of segs) { ctx.fillStyle = h ? C.gold : (o.c || C.fg); ctx.fillText(sg, cx, y); cx += ctx.measureText(sg).width; }
  ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function withA(a, fn) { if (a <= 0.001) return; ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }
function at(x, y, s, rot, fn) { ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (s !== 1) ctx.scale(s, s); fn(); ctx.restore(); }

// ---------- 背景 ----------
const R0 = rng(7);
const STARS = Array.from({ length: 240 }, () => ({ x: R0() * W, y: R0() * H, r: .4 + R0() * 1.4, w: .3 + R0() * 1.6, p: R0() * 6.28, b: .15 + R0() * .5 }));
const DUST = Array.from({ length: 40 }, () => ({ x: R0() * W, y: R0() * H, r: 1 + R0() * 2.5, vx: (R0() - .5) * 8, vy: -2 - R0() * 6, b: .05 + R0() * .12 }));
function drawBG(t) {
  const g = ctx.createRadialGradient(W / 2, H * .42, 80, W / 2, H * .45, 1150);
  g.addColorStop(0, '#14142e'); g.addColorStop(.55, '#0b0b1d'); g.addColorStop(1, C.bg0);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of STARS) {
    const a = s.b * (.55 + .45 * Math.sin(t * s.w + s.p));
    ctx.fillStyle = `rgba(220,220,255,${a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  }
  for (const d of DUST) {
    const x = ((d.x + d.vx * t) % W + W) % W, y = ((d.y + d.vy * t) % H + H) % H;
    ctx.fillStyle = `rgba(201,169,106,${d.b})`;
    ctx.beginPath(); ctx.arc(x, y, d.r, 0, 6.283); ctx.fill();
  }
}

// ---------- 道具 ----------
function lychee(x, y, r, fresh = 1, rot = 0) {
  at(x, y, 1, rot, () => {
    const red = [200, 50, 60], brown = [110, 62, 44];
    const c = red.map((v, i) => Math.round(lerp(brown[i], v, fresh)));
    ctx.fillStyle = `rgb(${c})`;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.clip();
    ctx.fillStyle = `rgba(0,0,0,${.18 + (1 - fresh) * .15})`;
    const s = r / 5;
    for (let gy = -r; gy <= r; gy += s * 1.6) for (let gx = -r; gx <= r; gx += s * 1.8) {
      const ox = (Math.round(gy / (s * 1.6)) % 2) * s * .9;
      ctx.beginPath(); ctx.arc(gx + ox, gy, s * .55, 0, 6.283); ctx.fill();
    }
    const g = ctx.createRadialGradient(-r * .35, -r * .4, 1, 0, 0, r);
    g.addColorStop(0, `rgba(255,220,200,${.35 * fresh})`); g.addColorStop(1, 'rgba(0,0,0,.25)');
    ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r);
    ctx.restore();
    ctx.strokeStyle = '#5a4a2a'; ctx.lineWidth = Math.max(2, r * .08); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -r * .95); ctx.quadraticCurveTo(r * .1, -r * 1.3, r * .35, -r * 1.45); ctx.stroke();
    ctx.fillStyle = `rgb(${Math.round(lerp(120, 70, fresh))},${Math.round(lerp(110, 140, fresh))},${Math.round(lerp(60, 70, fresh))})`;
    ctx.beginPath(); ctx.ellipse(r * .55, -r * 1.4, r * .5, r * .2, -.4, 0, 6.283); ctx.fill();
  });
}
// 竖排古籍：cols 用 | 分列，自右向左
function vtext(cols, x, y, o = {}) {
  const size = o.s || 34, gap = o.gap || size * 1.5;
  cols.split('|').forEach((col, ci) => {
    [...col].forEach((ch, k) => {
      const hi = o.hi && o.hi.includes(ch) && (!o.hiCol || o.hiCol.includes(ci));
      txt(ch, x - ci * gap, y + k * size * 1.12, { s: size, w: o.w || 700, f: F.serif, c: hi ? C.red : (o.c || C.ink) });
    });
  });
}
function palace(x, y, s, a = 1) {
  withA(a, () => at(x, y, s, 0, () => {
    ctx.strokeStyle = C.gold; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.fillStyle = 'rgba(201,169,106,.07)';
    // 台基
    ctx.beginPath(); ctx.rect(-260, 60, 520, 34); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-60, 94); ctx.lineTo(-90, 140); ctx.lineTo(90, 140); ctx.lineTo(60, 94); ctx.stroke();
    // 柱
    for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(i * 62, -40); ctx.lineTo(i * 62, 60); ctx.stroke(); }
    // 屋檐（起翘）
    ctx.beginPath(); ctx.moveTo(-300, -36); ctx.quadraticCurveTo(-230, -50, -200, -80); ctx.lineTo(200, -80); ctx.quadraticCurveTo(230, -50, 300, -36);
    ctx.quadraticCurveTo(260, -40, 240, -44); ctx.lineTo(-240, -44); ctx.quadraticCurveTo(-260, -40, -300, -36); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-200, -80); ctx.quadraticCurveTo(-120, -130, -60, -150); ctx.lineTo(60, -150); ctx.quadraticCurveTo(120, -130, 200, -80); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-80, -150); ctx.lineTo(80, -150); ctx.moveTo(-90, -158); ctx.quadraticCurveTo(-100, -170, -110, -168); ctx.moveTo(90, -158); ctx.quadraticCurveTo(100, -170, 110, -168); ctx.stroke();
  }));
}
function nameplate(x, y, zh, en, a = 1) {
  withA(a, () => {
    ctx.save(); ctx.font = font({ s: 32, w: 700 }); const w = Math.max(ctx.measureText(zh).width + 80, 300); ctx.restore();
    ctx.fillStyle = 'rgba(18,18,48,.85)'; ctx.strokeStyle = 'rgba(201,169,106,.6)'; ctx.lineWidth = 1.5;
    rr(x - w / 2, y - 50, w, 100, 8); ctx.fill(); ctx.stroke();
    txt(zh, x, y - 14, { s: 32, w: 700 });
    txt(en, x, y + 26, { s: 22, f: F.gar, it: 1, c: C.gray });
  });
}

// ---------- 地图 ----------
const MAP = { k: 50, ox: 560, oy: 110 };
const P = (lon, lat) => [MAP.ox + (lon - 104) * MAP.k, MAP.oy + (36 - lat) * MAP.k];
const CITY = { changan: P(108.94, 34.27), fuzhou: P(107.39, 29.70), guang: P(113.26, 23.13), mawei: P(108.43, 34.30), fanyang: P(116.4, 39.9) };
const ROUTE_FU = [[107.39, 29.70], [107.9, 30.8], [107.5, 31.2], [107.6, 32.2], [107.77, 32.98], [108.3, 33.6], [108.94, 34.27]].map(p => P(...p));
const ROUTE_LN = [[113.26, 23.13], [113.6, 24.8], [113.0, 25.8], [112.6, 26.9], [113.0, 28.2], [112.2, 30.3], [112.1, 32.0], [109.9, 33.9], [108.94, 34.27]].map(p => P(...p));
const YANGTZE = [[104.6, 28.8], [105.4, 28.9], [106.5, 29.6], [107.4, 29.7], [108.4, 30.8], [109.6, 31.0], [110.6, 30.9], [111.3, 30.7], [112.2, 30.3], [113.1, 29.6], [114.3, 30.6]].map(p => P(...p));
const WEI = [[105.7, 34.6], [107.2, 34.4], [108.2, 34.3], [109.0, 34.4], [110.2, 34.6]].map(p => P(...p));
function polyLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }
function polyAt(pts, p) {
  const L = polyLen(pts) * clamp(p); let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (acc + d >= L) { const q = (L - acc) / d; return [lerp(pts[i - 1][0], pts[i][0], q), lerp(pts[i - 1][1], pts[i][1], q)]; }
    acc += d;
  }
  return pts[pts.length - 1];
}
function drawPoly(pts, p, style) {
  ctx.save(); Object.assign(ctx, style);
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  const L = polyLen(pts) * clamp(p); let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (acc + d >= L) { const q = (L - acc) / d; ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], q), lerp(pts[i - 1][1], pts[i][1], q)); break; }
    ctx.lineTo(...pts[i]); acc += d;
  }
  ctx.stroke(); ctx.restore();
}
function cityDot(c, name, en, o = {}) {
  const [x, y] = c;
  ctx.fillStyle = o.c || C.gold; ctx.beginPath(); ctx.arc(x, y, o.r || 8, 0, 6.283); ctx.fill();
  if (o.pulse) { ctx.strokeStyle = o.c || C.gold; ctx.lineWidth = 2; ctx.globalAlpha *= (1 - o.pulse); ctx.beginPath(); ctx.arc(x, y, 8 + o.pulse * 30, 0, 6.283); ctx.stroke(); ctx.globalAlpha /= Math.max(.001, 1 - o.pulse); }
  txt(name, x + (o.dx ?? 18), y + (o.dy ?? -4), { s: o.s || 28, w: 700, c: o.tc || C.fg, al: o.al || 'left' });
  if (en) txt(en, x + (o.dx ?? 18), y + (o.dy ?? -4) + 28, { s: 20, f: F.gar, it: 1, c: C.gray, al: o.al || 'left' });
}
function redDust(x, y, t, dirx, diry, n = 14) {
  const r = rng(Math.floor(t * 30) + 7);
  for (let i = 0; i < n; i++) {
    const k = i / n, sp = 10 + k * 70;
    const px = x - dirx * sp + (r() - .5) * 18 * k, py = y - diry * sp + (r() - .5) * 18 * k - k * 6;
    ctx.fillStyle = `rgba(214,90,60,${.55 * (1 - k)})`;
    ctx.beginPath(); ctx.arc(px, py, 2 + k * 5, 0, 6.283); ctx.fill();
  }
}
function rider(pts, p, t, col = C.fg) {
  const [x, y] = polyAt(pts, p), [x2, y2] = polyAt(pts, Math.min(1, p + .01));
  const d = Math.hypot(x2 - x, y2 - y) || 1;
  redDust(x, y, t, (x2 - x) / d, (y2 - y) / d);
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y + Math.sin(t * 18) * 1.5, 7, 0, 6.283); ctx.fill();
  return [x, y];
}
function mapBase(t, a) {
  withA(a, () => {
    ctx.strokeStyle = 'rgba(234,234,242,.06)'; ctx.lineWidth = 1;
    for (let lon = 104; lon <= 118; lon += 2) { const [x] = P(lon, 0); ctx.beginPath(); ctx.moveTo(x, 120); ctx.lineTo(x, 760); ctx.stroke(); }
    for (let lat = 22; lat <= 36; lat += 2) { const [, y] = P(0, lat); ctx.beginPath(); ctx.moveTo(560, y); ctx.lineTo(1280, y); ctx.stroke(); }
    drawPoly(YANGTZE, 1, { strokeStyle: 'rgba(127,167,217,.35)', lineWidth: 3, lineCap: 'round', lineJoin: 'round' });
    drawPoly(WEI, 1, { strokeStyle: 'rgba(127,167,217,.3)', lineWidth: 2 });
    txt('长江', ...P(110.0, 30.4), { s: 20, c: 'rgba(127,167,217,.6)' });
    // 秦岭
    ctx.strokeStyle = 'rgba(201,169,106,.3)'; ctx.lineWidth = 2;
    for (let i = 0; i < 7; i++) { const [x, y] = P(106.0 + i * .8, 33.7 - Math.sin(i) * .15); ctx.beginPath(); ctx.moveTo(x - 16, y + 10); ctx.lineTo(x, y - 8); ctx.lineTo(x + 16, y + 10); ctx.stroke(); }
    txt('秦岭', ...P(106.6, 33.05), { s: 20, c: 'rgba(201,169,106,.6)' });
  });
}

// ---------- 场景 ----------
function sceneHook(t) {
  const a = win(t, 0, 15.2, .5, .9);
  if (a <= 0) return;
  withA(a, () => {
    // 0–4：一颗荔枝
    const conv = eio(prog(t, 13.6, 15.0));
    const big = win(t, 0.2, 4.6, .8, .6);

      g.addColorStop(0, `rgba(181,58,47,${.45})`); g.addColorStop(.85, 'rgba(181,58,47,.12)'); g.addColorStop(1, 'rgba(181,58,47,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      withA(eo(prog(t, 109.0, 109.8)), () => {
        txt('范阳 →', 1250, 160, { s: 26, w: 700, c: '#e0786a', al: 'left' });
        txt('天宝十四载 · 755', 1240, 210, { s: 34, w: 900, f: F.serif, c: '#e0786a', al: 'left' });
        txt('安史之乱', 1240, 258, { s: 28, w: 700, c: C.fg, al: 'left' });
      });
    }
    // 马嵬驿
    const pm = eo(prog(t, 112.6, 113.6));
    if (pm > 0) withA(pm, () => {
      const [x, y] = CITY.mawei;
      const [cx2, cy2] = CITY.changan;
      // 出逃路线
      ctx.strokeStyle = 'rgba(234,234,242,.7)'; ctx.lineWidth = 2; ctx.setLineDash([5, 6]);
      ctx.beginPath(); ctx.moveTo(cx2, cy2); ctx.lineTo(lerp(cx2, x - 40, pm), lerp(cy2, y + 30, pm)); ctx.stroke(); ctx.setLineDash([]);
      const [mx, my] = [x - 40, y + 30];
      ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(mx, my, 10, 0, 6.283); ctx.fill();
      txt('马嵬驿', mx - 20, my - 34, { s: 30, w: 900, f: F.serif, c: '#e0786a', al: 'right' });
      txt('Mawei Station · 756', mx - 20, my + 34, { s: 22, f: F.gar, it: 1, c: C.gray, al: 'right' });
    });
    // 116.5–124：驿道再亮一次，荔枝落在马嵬驿
    const glow = win(t, 116.5, 124.6, 1.0, .6);
    if (glow > 0) withA(glow, () => {
      drawPoly(ROUTE_FU, 1, { strokeStyle: C.gold, lineWidth: 5, lineCap: 'round', lineJoin: 'round', shadowColor: 'rgba(201,169,106,.8)', shadowBlur: 20 });
      const p = eio(prog(t, 116.6, 119.6));
      const [x, y] = polyAt(ROUTE_FU, p);
      lychee(x, y - 24, 18, 1);
      const pl = eo(prog(t, 120.5, 121.6));
      if (pl > 0) {
        const [mx, my] = [CITY.mawei[0] - 40, CITY.mawei[1] + 30];
        lychee(lerp(CITY.changan[0], mx, pl), lerp(CITY.changan[1] - 24, my - 30, pl), 18, lerp(1, .55, pl));
      }
    });
  });
}
function sceneOutro(t) {
  const a1 = win(t, 124.4, 128.6, .6, .5);
  withA(a1, () => {
    const y = 430 + (1 - eo(prog(t, 124.4, 125.2))) * 20;
    ctx.fillStyle = 'rgba(18,18,48,.88)'; ctx.strokeStyle = 'rgba(201,169,106,.6)'; ctx.lineWidth = 1.5;
    rr(360, y - 180, 1200, 360, 14); ctx.fill(); ctx.stroke();
    txt('声明', 960, y - 110, { s: 40, w: 900, f: F.serif, c: C.gold });
    txt('Notes', 960, y - 66, { s: 24, f: F.gar, it: 1, c: C.gray });
    txt('贵妃荔枝的产地，岭南说与涪州说至今并存；', 960, y + 4, { s: 30, w: 700 });
    txt('路线、驿数、天数均为按史料记载的示意估算，不是精确复原。', 960, y + 54, { s: 26, c: '#C8C8D8' });
    txt('Routes and numbers are illustrative estimates from historical records.', 960, y + 106, { s: 24, f: F.gar, it: 1, c: C.gray });
  });
  const a2 = win(t, 128.5, 136, .6, .1);
  withA(a2, () => {
    const y0 = 170;
    txt('参考 · References', 960, y0, { s: 34, w: 900, f: F.serif, c: C.gold });
    const refs = [
      '欧阳修、宋祁《新唐书 · 后妃传 · 杨贵妃》',
      '杜牧《过华清宫绝句三首》 · 白居易《荔枝图序》 · 苏轼《荔支叹》',
      '《唐六典》驿制 · 乐史《太平寰宇记》“荔枝道”',
      '严耕望《唐代交通图考》',
    ];
    refs.forEach((r, i) => withA(eo(prog(t, 128.8 + i * .2, 129.4 + i * .2)), () => txt(r, 960, y0 + 74 + i * 54, { s: 28, f: F.serif, w: 700, c: '#C8C8D8' })));
    withA(eo(prog(t, 130.0, 130.8)), () => {
      ctx.strokeStyle = 'rgba(201,169,106,.5)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(760, 470); ctx.lineTo(1160, 470); ctx.stroke();
      txt(AUTHOR + ' 出品', 960, 526, { s: 36, w: 700, c: C.gold });
      txt('本片由 AI 用代码生成 · 无实拍素材 · 地图与人物均为示意', 960, 578, { s: 24, c: C.gray });
      lychee(960, 680, 34 + Math.sin(t * 2) * 1.5, 1, Math.sin(t) * .05);
    });
  });
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  drawBG(t);
  sceneHook(t);
  sceneTitle(t);
  sceneTang(t);
  sceneBai(t);
  sceneMap(t);
  sceneEnd(t);
  sceneOutro(t);
  drawChrome(t);
}

function drawChrome(t) {
  txt(AUTHOR, 56, 64, { s: 26, w: 700, c: C.fg, a: .5, al: 'left' });
  for (const [a, b, s] of TAGS) {
    const al = win(t, a, b, .5, .4);
    if (al <= 0) continue;
    withA(al, () => {
      ctx.save(); ctx.font = font({ s: 24, w: 700 }); ctx.letterSpacing = '4px';
      const w = ctx.measureText(s).width; ctx.restore();
      const y = 64;
      ctx.strokeStyle = 'rgba(201,169,106,.55)'; ctx.lineWidth = 1.5;
      const L = 60 * eo(prog(t, a, a + .8));
      ctx.beginPath(); ctx.moveTo(W / 2 - w / 2 - 24 - L, y); ctx.lineTo(W / 2 - w / 2 - 24, y);
      ctx.moveTo(W / 2 + w / 2 + 24, y); ctx.lineTo(W / 2 + w / 2 + 24 + L, y); ctx.stroke();
      txt(s, W / 2 + 2, y, { s: 24, w: 700, c: C.gold, ls: 4 });
    });
  }
  for (const [a, b, s] of NOTES) {
    const al = win(t, a, b, .4, .3);
    if (al <= 0) continue;
    withA(al, () => {
      ctx.save(); ctx.font = font({ s: 25 }); const w = ctx.measureText(s).width; ctx.restore();
      ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(W / 2 - w / 2 - 18, 778, 4, 0, 6.283); ctx.fill();
      txt(s, W / 2 + 6, 778, { s: 25, c: '#A8A8BC' });
    });
  }
  for (const [a, b, zh, en] of SUBS) {
    const al = win(t, a, b, .35, .3);
    if (al <= 0) continue;
    const dy = (1 - eo(prog(t, a, a + .45))) * 8;
    withA(al, () => {
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 12;
      rich(zh, W / 2, 946 + dy, { s: 46, w: 700 });
      txt(en, W / 2, 1001 + dy, { s: 29, f: F.gar, it: 1, c: C.gray });
      ctx.restore();
    });
  }
}

// 做旧纸卡
const SPECK = (() => { const r = rng(42); return Array.from({ length: 260 }, () => [r(), r(), r()]); })();
function paperCard(x, y, w, h, rot, s, content) {
  at(x, y, s, rot, () => {
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
    ctx.fillStyle = C.paper; rr(-w / 2, -h / 2, w, h, 6); ctx.fill(); ctx.restore();
    const g = ctx.createRadialGradient(0, 0, Math.min(w, h) * .2, 0, 0, Math.max(w, h) * .7);
    g.addColorStop(0, 'rgba(255,250,235,0)'); g.addColorStop(1, 'rgba(140,110,70,.28)');
    ctx.fillStyle = g; rr(-w / 2, -h / 2, w, h, 6); ctx.fill();
    for (const [a, b, c] of SPECK) { ctx.fillStyle = `rgba(110,85,55,${.05 + c * .1})`; ctx.fillRect(-w / 2 + a * w, -h / 2 + b * h, 1.5 + c * 2, 1.5 + c * 2); }
    ctx.strokeStyle = 'rgba(120,95,60,.35)'; ctx.lineWidth = 1.5; rr(-w / 2 + 14, -h / 2 + 14, w - 28, h - 28, 3); ctx.stroke();
    content();
  });
}
function seal(x, y, chars, s = 1) {
  at(x, y, s, -0.1, () => {
    ctx.fillStyle = 'rgba(181,58,47,.9)'; rr(-46, -46, 92, 92, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(237,228,211,.8)'; ctx.lineWidth = 2; rr(-40, -40, 80, 80, 5); ctx.stroke();
    const c = [...chars];
    const pos = c.length === 4 ? [[-18, -17], [18, -17], [-18, 18], [18, 18]] : c.map((_, i) => [0, (i - (c.length - 1) / 2) * 34]);
    c.forEach((ch, i) => txt(ch, pos[i][0], pos[i][1], { s: c.length === 4 ? 30 : 32, w: 900, f: F.serif, c: C.paper }));
  });
}
window.render = render;
window.DURATION = DUR;
// 字体子集按需加载：用本脚本出现过的全部字符去请求
window.setup = async function (done) {
  const sample = [...new Set(document.getElementById('main').textContent)].join('');
  const specs = ['400 30px "Noto Sans SC"', '700 30px "Noto Sans SC"', '900 30px "Noto Sans SC"', '700 30px "Noto Serif SC"', '900 30px "Noto Serif SC"', '400 30px "EB Garamond"', 'italic 400 30px "EB Garamond"', '600 30px "EB Garamond"'];
  await Promise.all(specs.map(s => document.fonts.load(s, sample)));
  await document.fonts.ready;
  done && done();
};
// 浏览器直接打开时循环预览
window.setup().then(() => {
  const t0 = performance.now();
  const loop = () => { if (window.__RENDER_MODE__) return; render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  loop();
});
